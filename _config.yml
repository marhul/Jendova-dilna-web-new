# Jendova dílna – vlastní šablona (bez Beautiful Jekyll)

title: Jendova dílna
tagline: Místo pro tvoření, které nese Jendovo jméno
description: Spolek Jendova dílna v Českých Budějovicích – keramika, kroužky pro děti, workshopy a cestovatelské večery.
lang: cs
locale: cs_CZ

url: "https://new.jendovadilna.cz"
baseurl: ""

# true = testovací web: noindex pro vyhledávače a pruh „testovací verze“.
# Při překlopení na jendovadilna.cz přepnout na false a změnit url.
staging: true

timezone: Europe/Prague
permalink: /:year/:month/:day/:title:output_ext

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

collections:
  krouzky:
    output: true
    permalink: /krouzky/:name/
  lektori:
    output: false

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: krouzky }
    values: { layout: krouzek }
  - scope: { path: "pages" }
    values: { layout: page }

logo: /img/jendovadilnaspolek_logo_200x200.png
image: /img/jendovadilnaspolek_logo_200x200.png

navigace:
  - { title: Kroužky, url: /krouzky/ }
  - { title: Akce a kalendář, url: /kalendar/ }
  - { title: Aktuality, url: /aktuality/ }
  - { title: Lektoři, url: /lektori/ }
  - { title: Galerie, url: /galerie/ }
  - { title: O spolku, url: /o-spolku/ }
  - { title: Kontakt, url: /kontakty/ }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docker-compose.yml
  - tools/
  - vendor/
  - .pages.yml
