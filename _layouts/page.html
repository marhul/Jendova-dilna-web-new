---
layout: default
---
<div class="page-head">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    {% assign sub = page.podtitul | default: page.subtitle %}
    {% if sub %}<p class="sub">{{ sub }}</p>{% endif %}
  </div>
</div>
<div class="page-body">
  <div class="wrap">
    {% if page.full_width or page.full-width %}
    {{ content }}
    {% else %}
    <div class="prose">{{ content }}</div>
    {% endif %}
  </div>
</div>
